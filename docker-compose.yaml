services:
  frontend:
    image: guidedsam_plume/frontend
    build:
      context: ./frontend
      dockerfile: frontend.Dockerfile
    ports:
      - 7262:80

  backend:
    image: guidedsam_plume/backend
    build:
      context: ./backend
      dockerfile: backend.Dockerfile
    ports:
      - 7263:5000
    volumes:
      - ./segmenter/data/:/data/:rw
    environment:
      - MODEL_SIZE=large
      - OFFLOAD_VIDEO_TO_CPU=True
      - GUNICORN_WORKERS=1
      # Inference API needs to have at least 2 threads to handle an incoming
      # parallel cancel propagation request
      - GUNICORN_THREADS=2
      - GUNICORN_PORT=5000
      - API_URL=http://localhost:7263
      #  ffmpeg/video encode settings
      - FFMPEG_NUM_THREADS=1
      - VIDEO_ENCODE_CODEC=libx264
      - VIDEO_ENCODE_CRF=23
      - VIDEO_ENCODE_FPS=24
      - VIDEO_ENCODE_MAX_WIDTH=1280
      - VIDEO_ENCODE_MAX_HEIGHT=720
      - VIDEO_ENCODE_VERBOSE=False
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
